  <div id="root"></div>
  <div id="gxc-entry" hidden data-state="preparing" data-status-visible="false" aria-label="Opening Ci Song's portfolio">
    <div class="gxc-entry-composition">
      <div id="gxc-entry-visual" role="group" tabindex="0" aria-label="Interactive glass ring. Drag or use arrow keys to turn.">

  <script id="gxc-entry-runtime">
  (() => {
    const root = document.getElementById('root'), shell = document.getElementById('gxc-entry');
    const status = document.getElementById('gxc-entry-status'), skip = document.getElementById('gxc-entry-skip'), retry = document.getElementById('gxc-entry-retry');
    const html = document.documentElement, startedAt = performance.now(), listeners = new Set();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)');
    const timers = new Set(); let releaseTimer = 0, minimumTimer = 0, fontTimer = 0, fontStarted = false;
    const bridge = window.__gxcEntry = {
      version: 'entry-v33', phase: 'preparing', startedAt, milestones: { started: 0 }, parts: { photo: 'pending', glass: 'pending' },
      appReady: false, fontsReady: false, reason: '', error: false,
      subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener); },
      markAppReady, settlePart, release, fail,
    };
    const elapsed = () => Math.max(0, performance.now() - startedAt);
    const milestone = name => { if (!(name in bridge.milestones)) bridge.milestones[name] = elapsed(); shell.dataset[name] = String(bridge.milestones[name]); };
    const later = (fn, delay) => { const id = setTimeout(() => { timers.delete(id); fn(); }, delay); timers.add(id); return id; };
    const cancel = id => { clearTimeout(id); timers.delete(id); };
    const notify = () => { html.dataset.gxcEntry = bridge.phase; shell.dataset.state = bridge.phase; shell.dataset.reason = bridge.reason; for (const fn of listeners) fn(); };
    function unlock() { root.inert = false; root.removeAttribute('inert'); html.classList.remove('gxc-entry-lock'); }
    function complete(reason) {
      const restoreFocus = shell.contains(document.activeElement);
      cancel(releaseTimer); cancel(minimumTimer); cancel(fontTimer);
      bridge.phase = 'complete'; bridge.reason = reason || bridge.reason; bridge.error = false;
      shell.dataset.error = 'false'; shell.hidden = true; unlock(); milestone('complete'); notify();
      if (restoreFocus) document.querySelector('#root .gxc-brand, #root a[href], #root button')?.focus({ preventScroll: true });
    }
    function fail(reason) {
      if (bridge.appReady) { release('app-fallback'); return; }
      if (bridge.error) return;
      cancel(releaseTimer); cancel(minimumTimer); cancel(fontTimer);
      bridge.phase = 'complete'; bridge.reason = reason || 'module-error'; bridge.error = true;
      shell.hidden = false; shell.dataset.error = 'true'; shell.dataset.statusVisible = 'true';
      status.textContent = reason === 'deadline' || reason === 'skip' ? 'The page is taking longer than expected. You can try again.' : 'Some page files could not be loaded. Please try again.';

    }
    function release(reason = 'released') {
      if (bridge.phase === 'complete') return;
      if (reason === 'hashchange' || reason === 'bfcache' || reason === 'deep-link' || reason === 'history') { complete(reason); return; }
      if (!bridge.appReady) { fail(reason); return; }
      if (bridge.phase === 'revealing') return;
      bridge.phase = 'revealing'; bridge.reason = reason; skip.hidden = true;
      milestone('revealing'); notify();
      releaseTimer = later(() => complete(reason), reduce.matches ? 100 : 650);
    }
    function check() {
      if (bridge.phase !== 'preparing' || !bridge.appReady || !bridge.fontsReady || bridge.parts.photo === 'pending' || bridge.parts.glass === 'pending') return;
      const remaining = (reduce.matches ? 0 : 800) - elapsed();
      if (remaining <= 0) release('ready');
      else if (!minimumTimer) minimumTimer = later(() => { minimumTimer = 0; check(); }, remaining);
    }
    function settleFonts(reason) {
      if (bridge.fontsReady) return;
      bridge.fontsReady = true; shell.dataset.fontResult = reason; cancel(fontTimer); milestone('fontsReady'); check();
    }
    function markAppReady() {
      if (bridge.appReady) return;
      bridge.appReady = true; milestone('appReady');
      if (bridge.error) { complete('recovered'); return; }
      if (!fontStarted) {
        fontStarted = true;
        // Wait after React/CSS are ready; fonts.ready at initial parse can resolve
        // before any face has been requested. Keep the total font gate bounded.
        fontTimer = later(() => settleFonts('timeout'), Math.max(0, 1500 - elapsed()));
        try {
          if (document.fonts?.load) Promise.allSettled([document.fonts.load('500 16px Inter'), document.fonts.load('500 38px "Space Grotesk"')]).then(() => settleFonts('settled'));
          else settleFonts('unsupported');
        } catch { settleFonts('fallback'); }
      }
      check();
    }
    function settlePart(part, result) {
      if ((part !== 'photo' && part !== 'glass') || (result !== 'ready' && result !== 'fallback')) return;
      bridge.parts[part] = result; shell.dataset[part] = result; milestone(part + 'Settled'); check();
    }
    skip.addEventListener('click', () => release('skip'));
    retry.addEventListener('click', () => location.reload());
    const visibility = () => { html.dataset.gxcEntryHidden = String(document.hidden); };
    document.addEventListener('visibilitychange', visibility); visibility();
    window.addEventListener('hashchange', () => release('hashchange'));
    window.addEventListener('pageshow', event => { if (event.persisted) release('bfcache'); });
    window.addEventListener('error', event => {
      const target = event.target;
      if (!bridge.appReady && (target?.tagName === 'SCRIPT' && target.type === 'module'
        || event.filename && /(?:\/src\/v2-1\/|\/assets\/2-1\/)/.test(event.filename))) fail('module-error');
    }, true);
    window.addEventListener('vite:preloadError', () => { if (!bridge.appReady) fail('module-error'); });
    const changedMotion = () => { if (reduce.matches && bridge.phase === 'revealing') { cancel(releaseTimer); releaseTimer = later(() => complete(bridge.reason), 100); } else check(); };
    reduce.addEventListener?.('change', changedMotion);
    const navigation = performance.getEntriesByType?.('navigation')[0];
    if (location.hash && location.hash !== '#' && location.hash !== '#top') complete('deep-link');
    else if (navigation?.type === 'back_forward') complete('history');
    else {
      html.classList.add('gxc-entry-lock', 'gxc-entry-played'); root.inert = true; root.setAttribute('inert', ''); shell.hidden = false; notify();

    // This survives a missing main bundle, including deep links which skip the intro.
    later(() => { if (!bridge.appReady) fail('deadline'); else if (bridge.phase === 'preparing') release('deadline'); }, 8000);
  })();
  </script>
